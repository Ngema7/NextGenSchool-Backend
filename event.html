<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events & marque</title>
  <link rel="stylesheet" href="admin all css/dashboard.css" />
  <link rel="stylesheet" href="admin all css/sidebar.css" />
  <link rel="stylesheet" href="admin all css/event.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="admin imgs/image copy.png" alt="logo" />
          <h2>ABC School</h2>
        </div>

        <i class="fa fa-times" id="closeBtn"></i>
      </div>

      <ul class="menu">
        <li> <a href="admin.html"><i class="fa fa-home"></i><span>Dashboard</span></a> </li>
        <li class="active"><a href="event.html"><i class="fa fa-calendar"></i><span>Events & marquee</span></a></li>
        <li><a href="galery.html"><i class="fa fa-image"></i><span>Gallery</span></a></li>
        <li><a href="teacher.html"><i class="fa fa-chalkboard-teacher"></i><span>Teachers</span></a></li>
        <li><a href="masages.html"><i class="fa fa-envelope"></i><span>Messages</span></a></li>
        <li><a href="result.html"><i class="fa fa-gear"></i><span>Result</span></a></li>
      </ul>

      <div class="logout">
        <i class="fa fa-sign-out-alt"></i><span>Logout</span>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div class="dash">
          <i class="fa fa-bars" id="toggleBtn"></i>
          <h2>Events & marquee</h2>
        </div>

        <div class="admin">
          <img src="admin imgs/image copy.png" alt="profile" />
          <h2>Admin</h2>
        </div>
      </div>



      <div class="card1 marquee-card">
        <h2> Marquee Updates</h2>

        <div class="input-row">
          <input type="text" id="marqueeInput" placeholder="Enter marquee notice" />
          <button onclick="addMarquee()">Add</button>
        </div>

        <div class="marquee-preview">
          <div class="marquee-text" id="marqueeDisplay"></div>
        </div>

        <ul class="mmmm" id="marqueeList"></ul>
      </div>

      <div class="card1">
        <h2>📰 News & Notices</h2>

        <div class="input-row">
          <input type="text" id="newsInput" placeholder="News / Notice title" />
          <input type="date" id="newsDate" />
          <button onclick="addNews()">Add</button>
        </div>

        <ul class="mmmm" id="newsList"></ul>
      </div>

      <div class="card1">
        <h2>📅 Upcoming Events</h2>

        <div class="input-row">
          <input type="text" id="eventInput" placeholder="Event title" />
          <input type="date" id="eventDate" />
          <input type="time" id="eventTime" />
          <button onclick="addEvent()">Add</button>
        </div>

        <div id="eventMessage" style="color: green; margin: 10px 0;"></div>
        <ul class="mmmm" id="eventList"></ul>
      </div>







    </div>

    <script src="JavaScript/event.js"></script>
</body>

</html>
