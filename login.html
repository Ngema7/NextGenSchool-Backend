<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>
<style>
  /* Form styling similar to your CSS */
  .form {
    --background: #d3d3d3;
    --input-focus: #2d8cf0;
    --font-color: #323232;
    --font-color-sub: #666;
    --bg-color: #fff;
    --main-color: #323232;
    padding: 20px;
    background: var(--background);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    border-radius: 5px;
    border: 2px solid var(--main-color);
    box-shadow: 4px 4px var(--main-color);
    width: 300px;
    margin: 100px auto;
  }

  .form > p {
    font-family: monospace;
    color: var(--font-color);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
  }

  .form > p > span {
    font-family: monospace;
    color: var(--font-color-sub);
    font-weight: 600;
    font-size: 17px;
  }

  .form > input {
    width: 100%;
    height: 40px;
    border-radius: 5px;
    border: 2px solid var(--main-color);
    background-color: var(--bg-color);
    box-shadow: 4px 4px var(--main-color);
    font-size: 15px;
    font-weight: 600;
    color: var(--font-color);
    padding: 5px 10px;
    outline: none;
  }

  .oauthButton {
    width: 100%;
    padding: 10px;
    text-align: center;
    border-radius: 5px;
    border: 2px solid var(--main-color);
    background-color: var(--bg-color);
    box-shadow: 4px 4px var(--main-color);
    font-size: 16px;
    font-weight: 600;
    color: var(--font-color);
    cursor: pointer;
    transition: all 250ms;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
  }

  .oauthButton:hover {
    background-color: var(--main-color);
    color: #fff;
  }
</style>
</head>
<body>

<form class="form" id="loginForm">
  <p>
    Welcome,<span>sign in to continue</span>
  </p>

  <input type="text" id="user" placeholder="Email or Number" required>
  <input type="password" id="pass" placeholder="Password" required>

  <button type="submit" class="oauthButton">Continue</button>
</form>

<script>
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', function(e) {
    e.preventDefault(); 

    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    const allowedUser = ["9745689221", "ngema.studio@gmail.com"];
    const allowedPass = "ngem@02302354#4";

    if (allowedUser.includes(user) && pass === allowedPass) {
      alert("Login Successful!");
      window.location.href = "./htmlsss/admin.html"; 
    } else {
      alert("Invalid credentials! Try again.");
    }
  });
</script>

</body>
</html>
