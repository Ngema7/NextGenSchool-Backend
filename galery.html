<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Admin Dashboard</title>
    <link rel="stylesheet" href="admin all css/dashboard.css" />
    <link rel="stylesheet" href="admin all css/sidebar.css" />
    <link rel="stylesheet" href="admin all css/galery.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="logo">
            <img src="admin imgs/image copy.png" alt="logo" />
            <h2>ABC School</h2>
          </div>

          <i class="fa fa-times" id="closeBtn"></i>
        </div>

        <ul class="menu">
          <li>
            <a href="admin.html"
              ><i class="fa fa-home"></i><span>Dashboard</span></a
            >
          </li>
          <li>
            <a href="event.html"
              ><i class="fa fa-calendar"></i><span>Events & marquee</span></a
            >
          </li>
          <li class="active">
            <a href="galery.html"
              ><i class="fa fa-image"></i><span>Gallery</span></a
            >
          </li>
          <li>
            <a href="teacher.html"
              ><i class="fa fa-chalkboard-teacher"></i><span>Teachers</span></a
            >
          </li>
          <li>
            <a href="masages.html"
              ><i class="fa fa-envelope"></i><span>Messages</span></a
            >
          </li>
          <li>
            <a href="result.html"
              ><i class="fa fa-gear"></i><span>Result</span></a
            >
          </li>
        </ul>
        <div class="logout">
          <i class="fa fa-sign-out-alt"></i><span>Logout</span>
        </div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="topbar">
          <div class="dash">
            <i class="fa fa-bars" id="toggleBtn"></i>
            <h2>galery</h2>
          </div>

          <div class="admin">
            <img src="admin imgs/image copy.png" alt="profile" />
            <h2>Admin</h2>
          </div>
        </div>
      </div>

      <section>
        <div class="gallery-section">
          <!-- Upload Area -->
          <div class="upload-box">
            <input type="file" id="imageInput" accept="image/*" />
            <label for="imageInput">📷 Upload Image</label>
          </div>

          <!-- Gallery -->
          <div class="gallery" id="gallery"></div>
        </div>
      </section>
    </div>

    <script src="JavaScript/galery.js"></script>
  </body>
</html>
