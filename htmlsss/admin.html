<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Admin Dashboard</title>
    <link rel="stylesheet" href="../admin all css/dashboard.css" />
    <link rel="stylesheet" href="../admin all css/sidebar.css" />
    <link rel="stylesheet" href="../admin all css/adduser.css">  
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="logo">
            <img src="../admin imgs/image copy.png" alt="logo" />
            <h2>NextGen School</h2>
          </div>

          <i class="fa fa-times" id="closeBtn"></i>
        </div>

        <ul class="menu">
          <li class="active">
            <a href="../admin.html"
              ><i class="fa fa-home"></i><span>Dashboard</span></a
            >
          </li>
          <li>
            <a href="../event.html"
              ><i class="fa fa-calendar"></i><span>Events & marquee</span></a
            >
          </li>
          <li>
            <a href="../galery.html"
              ><i class="fa fa-image"></i><span>Gallery</span></a
            >
          </li>
          <li>
            <a href="../teacher.html"
              ><i class="fa fa-chalkboard-teacher"></i><span>Teachers</span></a
            >
          </li>
          <li>
            <a href="../masages.html"
              ><i class="fa fa-envelope"></i><span>Messages</span></a
            >
          </li>
          <li>
            <a href="../result.html"
              ><i class="fa fa-gear"></i><span>Result</span></a
            > 
          </li>
        </ul>

        <div class="logout">
          <i class="fa fa-sign-out-alt"></i><span>Logout</span>
        </div>
      </div>

      <!-- MAIN -->
      <div class="main">
        <div class="topbar">
          <div class="dash">
            <i class="fa fa-bars" id="toggleBtn"></i>
            <h2>Dashboard</h2>
          </div>

          <div class="admin">
            <img src="../admin imgs/image copy.png" alt="profile" />
            <h2>Admin</h2>
          </div>
        </div>

        <!-- STATS -->
        <div class="stats">
          <div class="card blue">
            <h3>Total Students</h3>
            <p>1259</p>
          </div>

          <div class="card cyan">
            <h3>Total Teachers</h3>
            <p>56</p>
          </div>

          <div class="card orange">
            <h3>Total Notices</h3>
            <p>24</p>
          </div>

          <div class="card red">
            <h3>Upcoming Events</h3>
            <p>8</p>
          </div>
        </div>

        <!-- more ...-->
     <div class="container">
  <h2>Add Admin <i class="fa fa-plus" id="showForm"></i></h2>

  <form id="addUserForm" style="display: none">
    <input type="text" id="name" placeholder="Name" required />
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required />
      <i class="fa fa-eye toggle-password" id="togglePass"></i>
    </div>
    <button type="submit">Add</button>
  </form>

  <ul class="nge" id="newsList2"></ul>
</div>



      </div>
    </div>
    <script src="../JavaScript/app.js"></script>
  </body>
</html>
